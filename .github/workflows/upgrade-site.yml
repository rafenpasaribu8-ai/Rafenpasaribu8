name: Optimize memorial site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-site.yml'
      - '.github/scripts/upgrade_site.py'

permissions:
  contents: write

jobs:
  optimize-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract repeated inline photos and attach enhancements
        run: python .github/scripts/upgrade_site.py
      - name: Commit optimized site
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No site changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets upgrade.css upgrade.js
          git commit -m "Upgrade memorial site visuals and optimize gallery assets"
          git push origin HEAD:main
